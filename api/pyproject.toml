[project]
name = "ttd-booking-assistant"
version = "0.1.0"
description = "TTD Booking Assistant API"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.7",
    "uvicorn[standard]==0.34.0",
    "pymongo==4.10.1",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.2.0",
    "pydantic==2.10.6",
    "python-dotenv==1.0.1",
    "pydantic-settings==2.7.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest"]
