services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  api:
    build: ./api
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - JWT_SECRET=${JWT_SECRET:-ttd-dev-secret-change-me}
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  web:
    build:
      context: .
      args:
        VITE_API_BASE: ""
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo_data:
