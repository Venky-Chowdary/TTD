services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - JWT_SECRET=${JWT_SECRET:-ttd-dev-secret-change-me}
      - PORT=8000
    depends_on:
      - mongo

volumes:
  mongo_data:
